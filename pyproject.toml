[project]
name = "credences"
version = "0.1.0.dev0"
description = "LLM credence vectors over fixed answer sets."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credences"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "credences"
include_external_packages = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
