[project]
name = "credences"
version = "0.1.0.dev0"
description = "LLM credence vectors over fixed answer sets."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credences"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # Structural Python errors; the formatter handles layout.
    "F",              # Undefined names, unused imports, and similar mistakes.
    "I",              # Deterministic import ordering.
    "UP",             # Modern syntax for the supported Python version.
    "B",              # Common bug patterns, including mutable defaults.
    "N",              # PEP 8 naming conventions.
    "ANN",            # Annotated library interfaces and helpers.
    "D",              # Google-style API docstrings.
    "D400", "D401",    # Periods and imperative function summaries.
    "RUF100",         # Remove suppressions that no longer suppress anything.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Fixtures deliberately contain malformed inputs; avoid annotation/doc boilerplate.
"tests/**" = ["ANN", "D"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "credences"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure measurement core stays tokenizer- and backend-free"
type = "forbidden"
source_modules = ["credences.probabilities", "credences.errors", "credences.trie"]
forbidden_modules = [
    "credences.tokenization",
    "credences.reasoning",
    "credences.model",
    "credences.credoscope",
    "credences.backends",
    "credences.frames",
    "transformers",
    "tokenizers",
    "mlx",
    "mlx_lm",
    "torch",
    "pandas",
    "polars",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.20,<0.1",
]
